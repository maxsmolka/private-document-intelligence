name: pdi

x-backend-environment: &backend-environment
  PDI_ENV: development
  PDI_DATABASE_URL: postgresql+asyncpg://pdi:pdi@postgres:5432/pdi
  PDI_STORAGE_PATH: /data/documents
  PDI_MAX_UPLOAD_SIZE: 26214400
  PDI_LOG_LEVEL: INFO
  PDI_WORKER_POLL_INTERVAL: 2
  PDI_WORKER_MAX_ATTEMPTS: 3
  PDI_WORKER_JOB_TIMEOUT: 300
  PDI_WORKER_CONCURRENCY: 1
  PDI_EXECUTION_RESOURCE_LIMITS: '{"cpu_light":4,"cpu_heavy":2,"io_heavy":2,"ocr":1,"local_ai":1,"maintenance":1}'
  PDI_EXECUTION_STARVATION_SECONDS: 900
  PDI_EXECUTION_HEARTBEAT_SECONDS: 10
  PDI_OCR_ENABLED: "true"
  PDI_OCR_PROVIDER: ocrmypdf
  PDI_OCR_LANGUAGE: deu+eng
  PDI_OCR_COMMAND_TIMEOUT: 180
  PDI_OCR_MAX_PAGES: 100
  PDI_OCR_MAX_IMAGE_MPIXELS: 100
  PDI_OCR_FORCE_ROTATION: "true"
  PDI_OCR_MAX_DERIVED_SIZE: 104857600
  PDI_INTELLIGENCE_PROVIDER: deterministic
  PDI_INTELLIGENCE_TIMEOUT_SECONDS: 60
  PDI_INTELLIGENCE_MAX_INPUT_CHARACTERS: 100000
  PDI_AUTH_ENABLED: "true"
  PDI_SETUP_ENABLED: "true"
  PDI_AUTH_SECURE_COOKIES: "false"
  PDI_SESSION_TTL_SECONDS: 43200

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pdi
      POSTGRES_USER: pdi
      POSTGRES_PASSWORD: pdi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdi -d pdi"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    image: pdi-backend:local
    build:
      context: ./apps/api
    environment:
      <<: *backend-environment
      PDI_CORS_ORIGINS: '["http://localhost:3000"]'
      PDI_TOTP_ENCRYPTION_KEY: ${PDI_TOTP_ENCRYPTION_KEY:-MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=}
    volumes:
      - document_storage:/data/documents
      - backup_data:/backups
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    image: pdi-backend:local
    command: ["pdi-worker"]
    environment:
      <<: *backend-environment
      PDI_WORKER_IDENTITY: compose-worker
    volumes:
      - document_storage:/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "pdi.ingestion.health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 330s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_PDI_API_URL: http://localhost:8000
    environment:
      PDI_API_INTERNAL_URL: http://api:8000
      PDI_AUTH_ENABLED: "true"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/documents"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  consume:
    profiles: ["consume"]
    image: pdi-backend:local
    command: ["pdi-consume"]
    environment:
      <<: *backend-environment
      PDI_CONSUME_PATH: /consume
      PDI_CONSUME_PROCESSING_PATH: /consume-processing
      PDI_CONSUME_PROCESSED_PATH: /consume-processed
      PDI_CONSUME_FAILED_PATH: /consume-failed
      PDI_CONSUME_ENABLED: "true"
    volumes:
      - document_storage:/data/documents
      - consume_inbox:/consume
      - consume_processing:/consume-processing
      - consume_processed:/consume-processed
      - consume_failed:/consume-failed
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  mail:
    profiles: ["mail"]
    image: pdi-backend:local
    command: ["pdi-mail"]
    environment:
      <<: *backend-environment
      PDI_MAIL_ENABLED: "true"
      PDI_IMAP_HOST: ${PDI_IMAP_HOST:-}
      PDI_IMAP_USER: ${PDI_IMAP_USER:-}
      PDI_IMAP_PASSWORD_FILE: /run/secrets/imap_password
      PDI_IMAP_MAILBOX: ${PDI_IMAP_MAILBOX:-INBOX}
    volumes:
      - document_storage:/data/documents
      - ${PDI_IMAP_PASSWORD_FILE:-./secrets/imap_password.example}:/run/secrets/imap_password:ro
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  document_storage:
  backup_data:
  consume_inbox:
  consume_processing:
  consume_processed:
  consume_failed:
