[project]
name = "pdi-api"
version = "1.1.0"
description = "Private Document Intelligence API"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.15,<2",
  "argon2-cffi>=25,<26",
  "asyncpg>=0.30,<1",
  "cryptography>=50,<51",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.8,<3",
  "pypdf>=6.0,<7",
  "python-multipart>=0.0.20,<1",
  "qrcode>=8,<9",
  "sqlalchemy[asyncio]>=2.0.38,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
pdi = "pdi.cli:main"
pdi-worker = "pdi.ingestion.worker:main"
pdi-consume = "pdi.external.consume:main"
pdi-mail = "pdi.external.mail:main"
pdi-benchmark-ocr = "pdi.ingestion.benchmark:main"
pdi-benchmark-intelligence = "pdi.intelligence.benchmark:main"
pdi-benchmark-retrieval = "pdi.search.benchmark:main"
pdi-benchmark-knowledge = "pdi.knowledge.benchmark:main"
pdi-benchmark-operations = "pdi.operations.benchmark:main"
pdi-benchmark-architecture = "pdi.architecture.benchmark:main"

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "mypy>=1.15,<3",
  "pillow>=11,<13",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.9,<1",
  "types-qrcode>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["pdi", "tests"]
