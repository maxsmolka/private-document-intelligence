name: pdi

x-backend-environment: &backend-environment
  PDI_ENV: production
  PDI_DATABASE_URL: postgresql+asyncpg://pdi:${PDI_POSTGRES_PASSWORD:?set in .env.release}@postgres:5432/pdi
  PDI_STORAGE_PATH: /data/documents
  PDI_LOG_LEVEL: ${PDI_LOG_LEVEL:-INFO}
  PDI_WORKER_POLL_INTERVAL: 2
  PDI_WORKER_MAX_ATTEMPTS: 3
  PDI_WORKER_JOB_TIMEOUT: 300
  PDI_WORKER_CONCURRENCY: 1
  PDI_OCR_ENABLED: "true"
  PDI_OCR_PROVIDER: ocrmypdf
  PDI_OCR_LANGUAGE: deu+eng
  PDI_OCR_COMMAND_TIMEOUT: 180
  PDI_OCR_MAX_PAGES: 100
  PDI_OCR_MAX_IMAGE_MPIXELS: 100
  PDI_OCR_MAX_DERIVED_SIZE: 104857600
  PDI_INTELLIGENCE_PROVIDER: deterministic
  PDI_AUTH_ENABLED: "true"
  PDI_SETUP_ENABLED: ${PDI_SETUP_ENABLED:-true}
  PDI_AUTH_SECURE_COOKIES: ${PDI_AUTH_SECURE_COOKIES:-true}
  PDI_UPDATE_CHANNEL: ${PDI_UPDATE_CHANNEL:-manual}
  PDI_UPDATE_BACKEND_DIGEST: ${PDI_UPDATE_BACKEND_DIGEST:?set the installed immutable backend digest in .env.release}
  PDI_UPDATE_WEB_DIGEST: ${PDI_UPDATE_WEB_DIGEST:?set the installed immutable web digest in .env.release}
  PDI_UPDATE_EXPECTED_SCHEMA: ${PDI_UPDATE_EXPECTED_SCHEMA:-20260828_0018}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pdi
      POSTGRES_USER: pdi
      POSTGRES_PASSWORD: ${PDI_POSTGRES_PASSWORD:?set in .env.release}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdi -d pdi"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    image: ghcr.io/maxsmolka/private-document-intelligence/backend:${PDI_VERSION:-1.2.0}
    environment:
      <<: *backend-environment
      PDI_CORS_ORIGINS: '["${PDI_PUBLIC_URL:?set in .env.release}"]'
      PDI_BACKUP_PATH: /backups
      PDI_TOTP_ENCRYPTION_KEY: ${PDI_TOTP_ENCRYPTION_KEY:?set in .env.release}
    volumes:
      - document_storage:/data/documents
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  worker:
    image: ghcr.io/maxsmolka/private-document-intelligence/backend:${PDI_VERSION:-1.2.0}
    command: ["pdi-worker"]
    environment:
      <<: *backend-environment
      PDI_WORKER_IDENTITY: compose-worker
    volumes:
      - document_storage:/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "pdi.ingestion.health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    stop_grace_period: 330s
    restart: unless-stopped

  backup-scheduler:
    image: ghcr.io/maxsmolka/private-document-intelligence/backend:${PDI_VERSION:-1.2.0}
    command: ["pdi-backup-scheduler"]
    environment:
      <<: *backend-environment
      PDI_BACKUP_PATH: /backups
    volumes:
      - document_storage:/data/documents
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  consume:
    profiles: ["consume"]
    image: ghcr.io/maxsmolka/private-document-intelligence/backend:${PDI_VERSION:-1.2.0}
    command: ["pdi-consume"]
    environment:
      <<: *backend-environment
      PDI_CONSUME_ENABLED: "true"
      PDI_CONSUME_PATH: /consume-root/inbox
      PDI_CONSUME_PROCESSING_PATH: /consume-root/processing
      PDI_CONSUME_PROCESSED_PATH: /consume-root/processed
      PDI_CONSUME_FAILED_PATH: /consume-root/failed
      PDI_CONSUME_STABILITY_SECONDS: ${PDI_CONSUME_STABILITY_SECONDS:-10}
      PDI_CONSUME_POLL_INTERVAL: ${PDI_CONSUME_POLL_INTERVAL:-2}
    volumes:
      - document_storage:/data/documents
      - ${PDI_CONSUME_HOST_PATH:-./consume}:/consume-root
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  mail:
    profiles: ["mail"]
    image: ghcr.io/maxsmolka/private-document-intelligence/backend:${PDI_VERSION:-1.2.0}
    command: ["pdi-mail"]
    environment:
      <<: *backend-environment
      PDI_MAIL_ENABLED: "true"
      PDI_IMAP_HOST: ${PDI_IMAP_HOST:-}
      PDI_IMAP_PORT: ${PDI_IMAP_PORT:-993}
      PDI_IMAP_USER: ${PDI_IMAP_USER:-}
      PDI_IMAP_PASSWORD_FILE: /run/secrets/imap_password
      PDI_IMAP_MAILBOX: ${PDI_IMAP_MAILBOX:-INBOX}
      PDI_MAIL_POLL_INTERVAL: ${PDI_MAIL_POLL_INTERVAL:-60}
      PDI_IMAP_MAX_MESSAGES_PER_POLL: ${PDI_IMAP_MAX_MESSAGES_PER_POLL:-100}
      PDI_IMAP_SOCKET_TIMEOUT_SECONDS: ${PDI_IMAP_SOCKET_TIMEOUT_SECONDS:-30}
    volumes:
      - document_storage:/data/documents
      - ${PDI_IMAP_PASSWORD_FILE:-./secrets/imap_password}:/run/secrets/imap_password:ro
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ghcr.io/maxsmolka/private-document-intelligence/web:${PDI_VERSION:-1.2.0}
    environment:
      PDI_API_INTERNAL_URL: http://api:8000
      PDI_AUTH_ENABLED: "true"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  document_storage:
  backup_data:
