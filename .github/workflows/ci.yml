name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pdi_test
          POSTGRES_USER: pdi
          POSTGRES_PASSWORD: pdi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pdi -d pdi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PDI_TEST_POSTGRES_URL: postgresql+asyncpg://pdi:pdi@localhost:5432/pdi_test
      PDI_DATABASE_URL: postgresql+asyncpg://pdi:pdi@localhost:5432/pdi_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
          python-version: "3.13"
      - run: uv sync --locked
      - run: python ../../scripts/check_release_version.py
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run ruff check . ../../scripts
      - run: uv run ruff format --check . ../../scripts
      - run: uv run mypy .
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
