name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pdi_test
          POSTGRES_USER: pdi
          POSTGRES_PASSWORD: pdi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pdi -d pdi_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PDI_TEST_POSTGRES_URL: postgresql+asyncpg://pdi:pdi@localhost:5432/pdi_test
      PDI_DATABASE_URL: postgresql+asyncpg://pdi:pdi@localhost:5432/pdi_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
          python-version: "3.13"
      - run: uv sync --locked
      - run: python ../../scripts/check_release_version.py --tag "${{ github.ref_name }}"
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run ruff check . ../../scripts
      - run: uv run ruff format --check . ../../scripts
      - run: uv run mypy .
      - run: uv run pytest

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  publish:
    needs: [backend-quality, frontend-quality]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - id: backend-build
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          platforms: linux/amd64
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          build-args: |
            PDI_VERSION=${{ steps.backend-meta.outputs.version }}
            PDI_REVISION=${{ github.sha }}
            PDI_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          sbom: true
          provenance: mode=max

      - name: Record backend digest
        env:
          BACKEND_DIGEST: ${{ steps.backend-build.outputs.digest }}
        run: echo "Backend digest $BACKEND_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - id: web-build
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          platforms: linux/amd64
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          build-args: |
            PDI_VERSION=${{ steps.web-meta.outputs.version }}
            PDI_REVISION=${{ github.sha }}
            PDI_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          sbom: true
          provenance: mode=max

      - name: Record web digest
        env:
          WEB_DIGEST: ${{ steps.web-build.outputs.digest }}
        run: echo "Web digest $WEB_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@v3
        with:
          body_path: docs/releases/v1.0.0.md
          generate_release_notes: true
