name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pdi_test
          POSTGRES_USER: pdi
          POSTGRES_PASSWORD: pdi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pdi -d pdi_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PDI_TEST_POSTGRES_URL: postgresql+asyncpg://pdi:pdi@localhost:5432/pdi_test
      PDI_DATABASE_URL: postgresql+asyncpg://pdi:pdi@localhost:5432/pdi_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
          python-version: "3.13"
      - run: uv sync --locked
      - run: python ../../scripts/check_release_version.py --tag "$PDI_RELEASE_TAG"
        env:
          PDI_RELEASE_TAG: ${{ github.ref_name }}
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          source /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - run: pg_dump --version
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run ruff check . ../../scripts
      - run: uv run ruff format --check . ../../scripts
      - run: uv run mypy .
      - run: uv run pytest

  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  publish:
    needs: [backend-quality, frontend-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - id: build-info
        name: Record deterministic build timestamp
        run: echo "time=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: backend-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - id: backend-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: apps/api
          platforms: linux/amd64
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          build-args: |
            PDI_VERSION=${{ steps.backend-meta.outputs.version }}
            PDI_REVISION=${{ github.sha }}
            PDI_BUILD_TIME=${{ steps.build-info.outputs.time }}
            PDI_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          sbom: true
          provenance: mode=max

      - name: Record backend digest
        env:
          BACKEND_DIGEST: ${{ steps.backend-build.outputs.digest }}
        run: echo "Backend digest $BACKEND_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - id: web-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - id: web-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: apps/web
          platforms: linux/amd64
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          build-args: |
            PDI_VERSION=${{ steps.web-meta.outputs.version }}
            PDI_REVISION=${{ github.sha }}
            PDI_BUILD_TIME=${{ steps.build-info.outputs.time }}
            PDI_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          sbom: true
          provenance: mode=max

      - name: Record web digest
        env:
          WEB_DIGEST: ${{ steps.web-build.outputs.digest }}
        run: echo "Web digest $WEB_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate machine-verifiable release manifest
        env:
          BACKEND_DIGEST: ${{ steps.backend-build.outputs.digest }}
          WEB_DIGEST: ${{ steps.web-build.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python scripts/build_release_manifest.py
          --version "$RELEASE_TAG"
          --commit "$GITHUB_SHA"
          --backend-digest "$BACKEND_DIGEST"
          --web-digest "$WEB_DIGEST"

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
          files: pdi-release-manifest.json
