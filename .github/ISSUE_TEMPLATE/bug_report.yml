name: Bug report
description: Report a reproducible PDI defect using synthetic, non-sensitive data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is public. Do not include private documents, OCR text, personal data, credentials, tokens, logs containing sensitive values, backups, exports, or private infrastructure details. Report security issues through the private vulnerability-reporting link instead.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem without including private or identifying data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide the smallest reproduction using only synthetic fixtures and redacted output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include PDI version and general platform details only. Do not include hostnames, addresses, tokens, or private topology.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data confirmation
      options:
        - label: I used only synthetic/redacted information and included no private documents, personal data, credentials, secrets, backups, exports, or private infrastructure details.
          required: true
        - label: This is not a security vulnerability. Security reports must use GitHub private vulnerability reporting.
          required: true
