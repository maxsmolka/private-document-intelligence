name: Feature request
description: Propose a focused improvement without sharing private operational data.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is public. Describe the use case generically and use synthetic examples. Never attach documents, extracted text, personal data, credentials, backups, exports, or private infrastructure details.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What generic problem should PDI solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired outcome without private deployment details.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data confirmation
      options:
        - label: I used only synthetic/redacted information and included no private documents, personal data, credentials, secrets, backups, exports, or private infrastructure details.
          required: true
