version: 2
# Version-update pull requests are paused with feature development after v1.4.1.
# GitHub vulnerability alerts and security updates remain separate repository controls.
updates:
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      python-patch-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      web-patch-minor:
        patterns: ["*"]
        exclude-patterns: ["pdfjs-dist"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      actions-patch-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
